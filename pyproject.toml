[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drive-ai-document-filer"
version = "0.1.0"
description = "Claude reads documents dropped into a Google Drive Inbox, then they are renamed, filed by type and date, and logged to a Google Sheet. Every change can be undone."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "anthropic>=2.0",
  "google-auth>=2.30",
  "requests>=2.31",
  "pdfplumber>=0.11",
  "pytesseract>=0.3.10",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "Pillow>=10.0",
  "PyYAML>=6.0",
]

[project.scripts]
drive-filer = "drive_filer.cli:main"

[tool.setuptools]
packages = ["drive_filer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E731"]
